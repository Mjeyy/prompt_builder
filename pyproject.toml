[project]
name = "prompt-builder"
version = "0.2.0"
description = "Terminal and visual app for building car prompts and checking summary tables"
requires-python = ">=3.10"
dependencies = [
    "questionary>=2.0.0",
    "customtkinter>=5.2.0",
]

[project.scripts]
prompt-builder = "prompt_builder.main:main"
prompt-builder-gui = "prompt_builder.gui.app:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["prompt_builder*"]
